<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>{{company}} AI Preparation</title>


<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mobile-responsive.css') }}">

<style>


.ai-container{

padding:40px;

}

.ai-banner{

background:linear-gradient(135deg,#2563eb,#7c3aed);

color:white;

padding:45px;

border-radius:30px;

box-shadow:0 15px 30px rgba(37,99,235,0.3);

}


.ai-banner h1{

font-size:40px;

}


.ai-banner p{

font-size:18px;

opacity:0.9;

}





.ai-box{

    background:white;

    margin-top:30px;

    padding:35px;

    border-radius:25px;

    box-shadow:0 12px 30px rgba(0,0,0,0.12);

    border-left:8px solid #2563eb;

    transition:0.3s;

}


.ai-box:hover{

    transform:translateY(-5px);

    box-shadow:0 18px 35px rgba(0,0,0,0.18);

}



.ai-content h2{

    background:#eff6ff;

    padding:12px 18px;

    border-radius:15px;

    color:#1d4ed8;

}



.ai-content h3{

    margin-top:25px;

    color:#7c3aed;

}



.ai-content li{

    background:#f8fafc;

    padding:12px;

    margin:10px 0;

    border-radius:12px;

    border-left:5px solid #2563eb;

    list-style:none;

}



.ai-content li:hover{

    background:#eef2ff;

}



.ai-box h2{


color:#2563eb;

margin-bottom:20px;


}

.ai-content{

    color:#334155;

    font-size:16px;

    line-height:1.6;

}



.ai-content h1,
.ai-content h2,
.ai-content h3{

    color:#2563eb;

    margin-top:18px;

    margin-bottom:10px;

}



.ai-content p{

    margin:8px 0;

}



.ai-content li{

    margin:6px 0;

}





.highlight{


background:#eff6ff;

padding:15px;

border-radius:15px;


}


.ai-content h1,
.ai-content h2,
.ai-content h3{

    color:#2563eb;

    margin-top:25px;

}



.ai-content strong{

    color:#111827;

}



.ai-content ul{

    padding-left:25px;

}



.ai-content li{

    margin:10px 0;

}



.ai-content p{

    margin:12px 0;

}
.ai-content table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;

}


.ai-content th{

    background:#2563eb;

    color:white;

    padding:12px;

    text-align:left;

}



.ai-content td{

    padding:12px;

    border:1px solid #e2e8f0;

}



.ai-content tr:nth-child(even){

    background:#f8fafc;

}
.ai-badge{

display:inline-block;

margin-top:15px;

background:white;

color:#2563eb;

padding:8px 18px;

border-radius:20px;

font-weight:600;

}

.back{


margin-top:30px;

background:#2563eb;

color:white;

padding:13px 35px;

border-radius:30px;

border:none;

font-size:16px;

cursor:pointer;


}



</style>


</head>



<body>



<div class="sidebar">


<a href="{{url_for('dashboard')}}">
🏠 Dashboard
</a>


<a href="{{url_for('progress')}}">
📊 My Progress
</a>


<a href="{{url_for('companies')}}">
🏢 Companies
</a>


<a href="{{url_for('practice')}}">
📝 Practice
</a>


<a href="{{url_for('interview')}}">
🤖 AI Interview
</a>


<a href="{{url_for('settings')}}">
⚙ Settings
</a>


</div>






<div class="main">


<div class="ai-container">


<div class="ai-banner">


<h1>

🤖 {{company}} AI Interview Coach

</h1>


<div class="ai-badge">

🤖 AI Generated Preparation

</div>


</div>







<div class="ai-box">


<h2>
📚 Interview Preparation Guide
</h2>



<div class="ai-content">

{{ questions | safe }}

</div>


</div>






<a href="{{url_for('company_details',company_name=company)}}">


<button class="back">

← Back to {{company}}

</button>


</a>





</div>

</div>





</body>

</html>
