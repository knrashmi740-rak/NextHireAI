<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>{{ company }} AI Preparation</title>


<link rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mobile-responsive.css') }}">


<style>

/* =====================================================
   AI INTERVIEW PREPARATION PAGE
===================================================== */

.ai-container {

    padding: 40px;

    box-sizing: border-box;

    max-width: 1200px;

    margin: 0 auto;

}


/* =====================================================
   AI BANNER
===================================================== */

.ai-banner {

    background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    color: white;

    padding: 40px;

    border-radius: 25px;

    box-shadow:
        0 15px 30px rgba(37, 99, 235, 0.25);

}


.ai-banner h1 {

    color: white;

    font-size: 38px;

    margin: 0;

    line-height: 1.3;

}


.ai-banner p {

    color: white;

    font-size: 18px;

    opacity: 0.9;

}


/* =====================================================
   AI BADGE
===================================================== */

.ai-badge {

    display: inline-block;

    margin-top: 18px;

    background: white;

    color: #2563eb;

    padding: 9px 18px;

    border-radius: 20px;

    font-weight: 600;

    font-size: 14px;

}


/* =====================================================
   MAIN PREPARATION CARD
===================================================== */

.ai-box {

    background: white;

    margin-top: 30px;

    padding: 35px;

    border-radius: 25px;

    box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.10);

    border-left: 7px solid #2563eb;

    box-sizing: border-box;

}


/* =====================================================
   MAIN CARD HEADING
===================================================== */

.ai-box > h2 {

    color: #1d4ed8;

    background: #eff6ff;

    padding: 16px 20px;

    border-radius: 15px;

    margin: 0 0 30px 0;

    font-size: 25px;

}


/* =====================================================
   GENERATED AI CONTENT
===================================================== */

.ai-content {

    color: #1e293b;

    font-size: 17px;

    line-height: 1.75;

}


/* =====================================================
   GENERATED HEADINGS
===================================================== */

.ai-content h1 {

    color: #1e3a8a;

    font-size: 28px;

    margin-top: 30px;

    margin-bottom: 15px;

    line-height: 1.4;

}


.ai-content h2 {

    color: #2563eb;

    font-size: 24px;

    margin-top: 30px;

    margin-bottom: 15px;

    padding-bottom: 8px;

    border-bottom: 2px solid #dbeafe;

    line-height: 1.4;

}


.ai-content h3 {

    color: #7c3aed;

    font-size: 21px;

    margin-top: 25px;

    margin-bottom: 12px;

    line-height: 1.4;

}


/* =====================================================
   PARAGRAPHS
===================================================== */

.ai-content p {

    color: #334155;

    font-size: 17px;

    line-height: 1.8;

    margin: 12px 0;

}


/* =====================================================
   STRONG / BOLD TEXT
===================================================== */

.ai-content strong {

    color: #111827;

    font-weight: 700;

}


/* =====================================================
   LISTS
===================================================== */

.ai-content ul {

    padding-left: 25px;

    margin: 15px 0;

}


.ai-content ol {

    padding-left: 28px;

    margin: 15px 0;

}


/* =====================================================
   LIST ITEMS

   IMPORTANT:
   QUESTIONS WILL NOW BE DARK AND READABLE
===================================================== */

.ai-content li {

    color: #1e293b;

    background: #f8fafc;

    padding: 14px 16px;

    margin: 12px 0;

    border-radius: 12px;

    border-left: 4px solid #2563eb;

    line-height: 1.7;

    font-size: 16px;

}


/* Ordered-list numbers */

.ai-content ol li {

    padding-left: 10px;

}


/* =====================================================
   LIST ITEM HOVER
===================================================== */

.ai-content li:hover {

    background: #eef2ff;

}


/* =====================================================
   TABLE
===================================================== */

.ai-content table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 20px;

    margin-bottom: 25px;

    overflow: hidden;

    border-radius: 12px;

    font-size: 15px;

}


.ai-content th {

    background: #2563eb;

    color: white;

    padding: 13px;

    text-align: left;

    font-weight: 600;

}


.ai-content td {

    padding: 13px;

    border: 1px solid #e2e8f0;

    color: #334155;

    background: white;

}


.ai-content tr:nth-child(even) td {

    background: #f8fafc;

}


/* =====================================================
   CODE / PRE FORMATTED TEXT
===================================================== */

.ai-content pre {

    background: #0f172a;

    color: #f8fafc;

    padding: 18px;

    border-radius: 12px;

    overflow-x: auto;

    margin: 20px 0;

    font-size: 14px;

    line-height: 1.6;

}


.ai-content code {

    color: #1e293b;

    background: #f1f5f9;

    padding: 2px 6px;

    border-radius: 5px;

}


.ai-content pre code {

    color: #f8fafc;

    background: transparent;

    padding: 0;

}


/* =====================================================
   BLOCKQUOTE / HIGHLIGHT
===================================================== */

.ai-content blockquote {

    background: #eff6ff;

    border-left: 5px solid #2563eb;

    padding: 15px 20px;

    margin: 20px 0;

    border-radius: 10px;

    color: #334155;

}


/* =====================================================
   HORIZONTAL LINE
===================================================== */

.ai-content hr {

    border: none;

    border-top: 1px solid #e2e8f0;

    margin: 30px 0;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back {

    margin-top: 30px;

    background: linear-gradient(
        135deg,
        #2563eb,
        #3b82f6
    );

    color: white;

    padding: 13px 35px;

    border-radius: 30px;

    border: none;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(37, 99, 235, 0.25);

    transition: 0.3s;

}


.back:hover {

    transform: translateY(-3px);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .ai-container {

        padding: 20px 15px;

        width: 100%;

        box-sizing: border-box;

    }


    /* -----------------------------
       BANNER
    ----------------------------- */

    .ai-banner {

        padding: 25px 20px;

        border-radius: 20px;

    }


    .ai-banner h1 {

        font-size: 27px;

        line-height: 1.35;

    }


    .ai-banner p {

        font-size: 15px;

    }


    .ai-badge {

        font-size: 13px;

        padding: 8px 14px;

    }


    /* -----------------------------
       MAIN CARD
    ----------------------------- */

    .ai-box {

        width: 100%;

        margin-top: 20px;

        padding: 20px 16px;

        border-radius: 18px;

        border-left: 5px solid #2563eb;

        box-sizing: border-box;

    }


    /* -----------------------------
       GUIDE HEADING
    ----------------------------- */

    .ai-box > h2 {

        font-size: 21px;

        padding: 13px 14px;

        margin-bottom: 22px;

        line-height: 1.4;

    }


    /* -----------------------------
       AI CONTENT
    ----------------------------- */

    .ai-content {

        font-size: 15px;

        color: #1e293b;

        line-height: 1.7;

        width: 100%;

    }


    .ai-content h1 {

        font-size: 23px;

        margin-top: 25px;

        margin-bottom: 12px;

    }


    .ai-content h2 {

        font-size: 20px;

        margin-top: 25px;

        margin-bottom: 12px;

    }


    .ai-content h3 {

        font-size: 18px;

        margin-top: 22px;

        margin-bottom: 10px;

    }


    /* -----------------------------
       QUESTION TEXT
    ----------------------------- */

    .ai-content p {

        color: #334155;

        font-size: 15px;

        line-height: 1.75;

        margin: 11px 0;

    }


    /* -----------------------------
       QUESTION LIST
    ----------------------------- */

    .ai-content ul,
    .ai-content ol {

        padding-left: 20px;

        margin: 12px 0;

    }


    .ai-content li {

        color: #1e293b;

        background: #f8fafc;

        font-size: 15px;

        line-height: 1.7;

        padding: 12px 12px;

        margin: 10px 0;

        border-radius: 10px;

        border-left: 4px solid #2563eb;

        box-sizing: border-box;

    }


    .ai-content ol li {

        padding-left: 8px;

    }


    /* -----------------------------
       TABLE
    ----------------------------- */

    .ai-content table {

        display: block;

        overflow-x: auto;

        width: 100%;

        font-size: 13px;

    }


    .ai-content th,
    .ai-content td {

        padding: 9px;

        white-space: nowrap;

    }


    /* -----------------------------
       CODE
    ----------------------------- */

    .ai-content pre {

        font-size: 12px;

        padding: 14px;

        overflow-x: auto;

    }


    .ai-content code {

        font-size: 13px;

    }


    /* -----------------------------
       BACK BUTTON
    ----------------------------- */

    .back {

        width: 100%;

        max-width: 300px;

        padding: 13px 20px;

        font-size: 15px;

    }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media (max-width: 400px) {

    .ai-container {

        padding: 15px 10px;

    }


    .ai-banner {

        padding: 22px 16px;

    }


    .ai-banner h1 {

        font-size: 24px;

    }


    .ai-box {

        padding: 16px 12px;

    }


    .ai-box > h2 {

        font-size: 19px;

    }


    .ai-content {

        font-size: 14px;

    }


    .ai-content p {

        font-size: 14px;

    }


    .ai-content li {

        font-size: 14px;

        padding: 11px 10px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="sidebar">


<a href="{{ url_for('dashboard') }}">
🏠 Dashboard
</a>


<a href="{{ url_for('progress') }}">
📊 My Progress
</a>


<a href="{{ url_for('companies') }}">
🏢 Companies
</a>


<a href="{{ url_for('practice') }}">
📝 Practice
</a>


<a href="{{ url_for('interview') }}">
🤖 AI Interview
</a>


<a href="{{ url_for('settings') }}">
⚙ Settings
</a>


</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">


<div class="ai-container">


<!-- =================================================
     AI BANNER
================================================= -->

<div class="ai-banner">


<h1>

🤖 {{ company }} AI Interview Coach

</h1>


<div class="ai-badge">

🤖 AI Generated Preparation

</div>


</div>


<!-- =================================================
     PREPARATION GUIDE
================================================= -->

<div class="ai-box">


<h2>

📚 Interview Preparation Guide

</h2>


<div class="ai-content">

{{ questions | safe }}

</div>


</div>


<!-- =================================================
     BACK BUTTON
================================================= -->

<a href="{{ url_for('company_details', company_name=company) }}">

<button class="back">

← Back to {{ company }}

</button>

</a>


</div>


</div>


</body>

</html>
