<!DOCTYPE html>
<html>

<head>

    <title>Login | NextHireAI</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/login.css') }}">
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/mobile-responsive.css') }}">
</head>

<body>

<div class="login-container">

<h1>NextHireAI</h1>

<h2>Login</h2>

<form method="POST" action="/login">

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">
        Login
    </button>

</form>

<p>

Don't have an account?

<a href="/register">

Register

</a>

</p>

</div>

</body>

</html>
